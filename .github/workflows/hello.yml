# 워크플로 이름(프로젝트 이름 아님): Actions 탭에 이 이름으로 보임
name: hello
# 언제 실행할지: main 브랜치에 push가 들어오면
on:
  push:
    branches: [main]
# 할 일 묶음(job). hello는 내가 붙인 이름
jobs:
  hello:
    # 어디서: GitHub가 빌려주는 리눅스(Ubuntu) 컴퓨터 = 러너
    runs-on: ubuntu-latest
    # 무엇을: 아래 단계를 위에서부터 차례로 실행
    steps:
      # uses = 남이 만든 액션. checkout은 git clone처럼 이번 커밋의 코드를 러너에 복사
      - uses: actions/checkout@v6
      # run = 러너의 리눅스 명령. 화면에 글자 출력
      - run: echo "Hello GitHub Actions"
      # 받은 파일 목록 보기 (checkout이 됐는지 확인)
      - run: ls -al
      # 러너에 Docker가 이미 설치되어 있는지 확인
      - run: docker --version
