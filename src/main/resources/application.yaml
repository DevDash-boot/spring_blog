spring:
  config:
    import: optional:file:.env[.properties]  # 스프링은 .env를 자동으로 읽지 않아 읽을 수 있도록 설정 추가
  mustache:
    servlet:
      expose-session-attributes: true  # 머스태치 세션 정보에 접근
  profiles:
    active: local

server:
  servlet:
    session:
      tracking-modes: cookie    # 세션 번호를 쿠키로만 전달 (주소에 ;jsessionid 를 붙이지 않음)
