server:
  port:5000

loging:
  level:
    root: INFO                       # 스프링과 라이브러리는 INFO 이상만 출력
    com.tenco.spring_blog: INFO

spring:
  # 데이터 베이스 연결(MySQL)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/myblog?serverTimezone=Asia/Seoul
    username: root
    password: root

  #JPA 설정
  jpa:
    hibernate:
      # 운영에서는 create를 사용하지 않는다. 없는 테이블과 컬럼만 추가한다.
      ddl-auto: update
    # 실행되는 SQL을 콘솔에 출력합니다.
    show-sql: true
    # 추후 data.sql을 테이블 생성 후에 실행합니다.
    defet-datasource-initialization: true