server:
  port:8080

logging:
  level:
    root: INFO                       # 스프링과 라이브러리는 INFO 이상만 출력
    com.tenco.spring_blog: DEBUG     # 우리 코드는 DEBUG 이상까지 출력

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  #JPA 설정
  jpa:
    # 기본값 : true - 뷰 렌더링까지 영속성 컨텍스트 유지. 지연 로딩 가능
    #     false - 트랜잭션이 끝나면 영속성 컨텍스트 종료. 지연 로딩불가
    open-In-view: true
    hibernate:
      # 운영에서는 create를 사용하지 않는다. 없는 테이블과 컬럼만 추가한다. create는 코드용
      ddl-auto: update
    # 실행되는 SQL을 콘솔에 출력합니다.
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 10  # 한 번에 최대 10개까지만 들고올 수 있다.
        format_sql: true    # 출력되는 SQL을 콘솔창에 줄바꿈해 보기 좋게 표시
    # 추후 data.sql을 테이블 생성 후에 실행합니다.
    defer-datasource-initialization: true

  # 서버 시작 시 이 파일 실행
  sql:
    init:
      mode: never  # always: DB 종류와 관계없이 항상 초기화. 기본값은 embedded이 있고, 추가로 never가 있음
      data-locations:
        - classpath:db/data.sql